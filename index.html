<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VaaniAI - AI Text to Speech</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */

    .sidebar {
      width: 230px;
      min-width: 230px;
      background: #111827;
      padding: 25px 15px;
      border-right: 1px solid #263041;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      padding: 10px;
      margin-bottom: 30px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .menu {
      padding: 13px;
      margin-bottom: 8px;
      border-radius: 10px;
      color: #b6c0d0;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu:hover {
      background: #252c3a;
      color: white;
    }

    .menu.active {
      background: #252c3a;
      color: white;
    }

    /* Main */

    .main {
      flex: 1;
      padding: 40px;
      max-width: 1100px;
      margin: auto;
      width: 100%;
    }

    .main h1 {
      margin-top: 0;
      font-size: 36px;
    }

    .subtitle {
      color: #b6c0d0;
      margin-bottom: 30px;
      font-size: 17px;
    }

    .card {
      background: #111827;
      border: 1px solid #263041;
      border-radius: 18px;
      padding: 30px;
      max-width: 750px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0b1220;
      color: white;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    .counter {
      text-align: right;
      color: #9ca3af;
      margin-top: 8px;
      margin-bottom: 25px;
    }

    .row {
      display: flex;
      gap: 25px;
      margin-bottom: 25px;
    }

    .row > div {
      flex: 1;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: white;
      font-size: 15px;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #8b5cf6;
      color: white;
    }

    .generate:hover {
      opacity: 0.9;
    }

    .clear {
      background: #252c3a;
      color: white;
    }

    .clear:hover {
      background: #374151;
    }

    .download {
      background: #22c55e;
      color: white;
      margin-top: 15px;
    }

    .status {
      margin-top: 15px;
      color: #cbd5e1;
      min-height: 24px;
    }

    .audio-box {
      display: none;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #263041;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    /* History Page */

    .history-page {
      flex: 1;
      padding: 40px;
      width: 100%;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .history-header h1 {
      margin: 0;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .history-card {
      background: #111827;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #263041;
      cursor: pointer;
      transition: 0.2s;
    }

    .history-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      border-color: #8b5cf6;
    }

    .history-card h3 {
      margin-top: 0;
    }

    .history-card p {
      margin: 10px 0;
      line-height: 1.5;
      color: #d1d5db;
    }

    .history-card small {
      color: #9ca3af;
    }

    @media (max-width: 700px) {

      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 100%;
        border-right: none;
        border-bottom: 1px solid #263041;
      }

      .main {
        padding: 25px 18px;
      }

      .history-page {
        padding: 25px 18px;
      }

      .row {
        flex-direction: column;
      }

      .buttons {
        flex-direction: column;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <div class="sidebar">

    <div class="logo">
      Vaani<span>AI</span>
    </div>

    <div class="menu active">
      🔊 Text to Speech
    </div>

    <div class="menu" id="historyMenu">
      🕘 History
    </div>

    <div class="menu" id="voicesMenu">
      🎙 My Voices
    </div>

    <div class="menu" id="settingsMenu">
      ⚙ Settings
    </div>

  </div>

<!-- History Panel -->
<div
  class="history-page"
  id="historyPage"
  style="display: none;"
>

  <div class="history-header">

    <h1>🕘 History</h1>

    <button
      id="closeHistory"
      class="clear"
    >
      ← Back
    </button>

  </div>


  <div
    id="historyList"
    class="history-list"
  >
  </div>


  <button
    id="deleteHistory"
    class="clear"
  >
    🗑 Clear History
  </button>

</div>
  <!-- Main -->

  <div class="main">

    <h1>AI Text to Speech</h1>

    <div class="subtitle">
      अपने text को natural AI voice में बदलें।
    </div>


    <div class="card">

      <label>Your Text</label>

      <textarea
        id="text"
        placeholder="यहाँ अपना Hindi या English text लिखें..."
      ></textarea>

      <div class="counter">
        <span id="count">0</span> characters
      </div>


      <div class="row">

        <div>

          <label>Voice</label>

          <select id="voice">

            <option value="hi-IN-SwaraNeural">Female Hindi Voice</option>
<option value="hi-IN-MadhurNeural">Male Hindi Voice</option>

          </select>

        </div>


        <div>

          <label>
            Speed:
            <span id="speedValue">
              1.0x
            </span>
          </label>

          <input
            type="range"
            id="speed"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          >

        </div>

      </div>


      <div class="buttons">

        <button
          class="generate"
          id="generate"
        >
          🔊 Generate Speech
        </button>


        <button
          class="clear"
          id="clear"
        >
          Clear Text
        </button>

      </div>


      <div
        class="status"
        id="status"
      >
        Ready to generate.
      </div>


      <div
        class="audio-box"
        id="audioBox"
      >

        <h3>
          Generated Audio
        </h3>

        <audio
          id="audio"
          controls
        ></audio>

        <br>

        <a
          id="download"
          download="VaaniAI-Audio.mp3"
        >

          <button
            class="download"
          >
            ⬇ Download MP3
          </button>

        </a>

      </div>

    </div>

  </div>

</div>


<script>
const text = document.getElementById("text");
const count = document.getElementById("count");
const speed = document.getElementById("speed");
const speedValue = document.getElementById("speedValue");

text.addEventListener("input", () => {
  count.textContent = text.value.length;
});

speed.addEventListener("input", () => {
  speedValue.textContent = speed.value + "x";
});

document.getElementById("clear").addEventListener("click", () => {
  text.value = "";
  count.textContent = "0";

  const audio = document.getElementById("audio");

  if (audio) {
    audio.pause();
    audio.currentTime = 0;
  }

  document.getElementById("status").textContent = "";
});

document.getElementById("generate").addEventListener("click", async () => {

  const value = text.value.trim();

  if (!value) {
    alert("पहले कुछ text लिखें।");
    return;
  }

  const status = document.getElementById("status");
  const generateButton = document.getElementById("generate");

  status.textContent = "MP3 voice बनाई जा रही है...";
  generateButton.disabled = true;

  try {

    const response = await fetch("/generate-speech", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
    text: value,
    speed: speed.value,
    voice: document.getElementById("voice").value
})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Voice generate नहीं हुई"
      );
    }

    const audio = document.getElementById("audio");
    const audioBox = document.getElementById("audioBox");
    const download = document.getElementById("download");

    audio.src = data.audioUrl;
    download.href = data.audioUrl;

    download.setAttribute(
      "download",
      "VaaniAI-Voice.mp3"
    );

    audioBox.style.display = "block";
const oldHistory = JSON.parse(
  localStorage.getItem("vaaniHistory") || "[]"
);

oldHistory.unshift({
  text: value,
  voice: document.getElementById("voice").value,
  audioUrl: data.audioUrl
});
localStorage.setItem(
  "vaaniHistory",
  JSON.stringify(oldHistory.slice(0, 20))
);
    status.textContent =
      "✅ MP3 तैयार है! अब सुन सकते हो या Download कर सकते हो।";

    audio.play();

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Error: " + error.message;

  } finally {

    generateButton.disabled = false;

  }

});
// History Page
const historyMenu = document.getElementById("historyMenu");
const historyPage = document.getElementById("historyPage");
const historyList = document.getElementById("historyList");
const closeHistory = document.getElementById("closeHistory");
const deleteHistory = document.getElementById("deleteHistory");

historyMenu.addEventListener("click", () => {

  const savedHistory = JSON.parse(
    localStorage.getItem("vaaniHistory") || "[]"
  );

  historyList.innerHTML = "";

  if (savedHistory.length === 0) {

    historyList.innerHTML =
      "<p>अभी कोई History नहीं है। पहले एक voice generate करें।</p>";

  } else {

    savedHistory.forEach((item, index) => {

      const card = document.createElement("div");

      card.className = "history-card";

      card.innerHTML = `
        <h3>${index + 1}. Generated Text</h3>
        <p>${item.text}</p>
        <small>🔊 Voice: ${item.voice}</small>
      `;

      card.addEventListener("click", () => {

        document.getElementById("text").value = item.text;
        document.getElementById("voice").value = item.voice;

        historyPage.style.display = "none";
        document.querySelector(".main").style.display = "block";

      });

      historyList.appendChild(card);

    });

  }

  document.querySelector(".main").style.display = "none";
  historyPage.style.display = "block";

});


closeHistory.addEventListener("click", () => {

  historyPage.style.display = "none";
  document.querySelector(".main").style.display = "block";

});


deleteHistory.addEventListener("click", () => {

  const confirmDelete = confirm(
    "क्या आप पूरी History delete करना चाहते हैं?"
  );

  if (confirmDelete) {

    localStorage.removeItem("vaaniHistory");

    historyList.innerHTML =
      "<p>History साफ़ कर दी गई है।</p>";

  }

});
// My Voices
const voicesMenu = document.getElementById("voicesMenu");

voicesMenu.addEventListener("click", () => {

  const voice = document.getElementById("voice");

  const choice = prompt(
    "अपनी Voice चुनें:\n\n1 = Female Hindi Voice\n2 = Male Hindi Voice"
  );

  if (choice === "1") {

    voice.value = "hi-IN-SwaraNeural";

    alert("Female Hindi Voice select हो गई!");

  } else if (choice === "2") {

    voice.value = "hi-IN-MadhurNeural";

    alert("Male Hindi Voice select हो गई!");

  } else if (choice !== null) {

    alert("कृपया 1 या 2 चुनें।");

  }

});
// Settings
const settingsMenu = document.getElementById("settingsMenu");

settingsMenu.addEventListener("click", () => {

  const settingChoice = prompt(
    "⚙️ SETTINGS\n\n" +
    "1 = Default Voice बदलें\n" +
    "2 = Voice Speed बदलें\n\n" +
    "1 या 2 लिखें:"
  );

  if (settingChoice === "1") {

    const voiceChoice = prompt(
      "Default Voice चुनें:\n\n" +
      "1 = Female Hindi Voice\n" +
      "2 = Male Hindi Voice"
    );

    if (voiceChoice === "1") {

      localStorage.setItem(
        "defaultVoice",
        "hi-IN-SwaraNeural"
      );

      document.getElementById("voice").value =
        "hi-IN-SwaraNeural";

      alert("Female Hindi Voice default set हो गई! ✅");

    } else if (voiceChoice === "2") {

      localStorage.setItem(
        "defaultVoice",
        "hi-IN-MadhurNeural"
      );

      document.getElementById("voice").value =
        "hi-IN-MadhurNeural";

      alert("Male Hindi Voice default set हो गई! ✅");

    }

  } else if (settingChoice === "2") {

    const speedChoice = prompt(
      "Voice Speed चुनें:\n\n" +
      "1 = Slow\n" +
      "2 = Normal\n" +
      "3 = Fast"
    );

    const speed = document.getElementById("speed");

    if (speedChoice === "1") {
      speed.value = "slow";
      localStorage.setItem("defaultSpeed", "slow");
      alert("Slow speed set हो गई! ✅");

    } else if (speedChoice === "2") {
      speed.value = "normal";
      localStorage.setItem("defaultSpeed", "normal");
      alert("Normal speed set हो गई! ✅");

    } else if (speedChoice === "3") {
      speed.value = "fast";
      localStorage.setItem("defaultSpeed", "fast");
      alert("Fast speed set हो गई! ✅");
    }

  } else if (settingChoice !== null) {

    alert("कृपया 1 या 2 चुनें।");

  }

});
</script>

</body>
</html>
